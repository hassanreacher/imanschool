<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title data-translate="title">تم تقديم الطلب بنجاح - مدارس الإيمان</title>
  
  <!-- Preloaded Styles & Google Fonts: Cairo & Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #0b2240; /* Royal Navy */
      --secondary-color: #c5a059; /* Classic Gold */
      --accent-color: #10b981; /* Emerald/WhatsApp Green */
      --bg-light: #f0f4f9;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --font-main: 'Cairo', 'Roboto', sans-serif;
      --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .success-container {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(11, 34, 64, 0.05), 0 1px 3px rgba(0,0,0,0.02);
      width: 100%;
      max-width: 480px;
      padding: 48px 32px;
      position: relative;
      overflow: hidden;
      animation: scale-up 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes scale-up {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background-color: var(--secondary-color);
    }

    .school-logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin: 0 auto 24px auto;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.05));
    }

    .success-icon-wrapper {
      width: 88px;
      height: 88px;
      background-color: rgba(16, 185, 129, 0.08);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 24px auto;
      position: relative;
    }

    .success-icon-wrapper::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent-color);
      animation: pulse-ring 2s infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    .success-icon-wrapper i {
      font-size: 3.2rem;
      color: var(--accent-color);
    }

    .success-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .success-message {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--primary-color);
      color: var(--secondary-color);
      border: 1px solid var(--primary-color);
      height: 48px;
      padding: 0 32px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: var(--transition-smooth);
      cursor: pointer;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      background-color: #16365c;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    .btn-home i {
      transition: var(--transition-smooth);
    }

    .btn-home:hover i {
      transform: translateX(-4px);
    }

    [dir="ltr"] .btn-home:hover i {
      transform: translateX(4px);
    }

    .footer-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 36px;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }
  </style>
</head>

<body>

  <div class="success-container">
    <img src="images/logo.png" alt="شعار مدارس الإيمان" class="school-logo" />
    
    <div class="success-icon-wrapper">
      <i class="fa-solid fa-circle-check"></i>
    </div>

    <h1 class="success-title" data-translate="success_title">تم تقديم طلبك بنجاح!</h1>
    <p class="success-message" data-translate="success_message">شكرًا لك على اهتمامك بالانضمام إلى كادرنا التعليمي. يرجى الانتظار، سيتواصل فريقنا معك قريبًا.</p>

    <a href="iman-schools.html" class="btn-home">
      <span data-translate="back_button">العودة إلى الصفحة الرئيسية</span>
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <p class="footer-note" data-translate="footer_note">مدارس الإيمان الإسلامية - شمال لبنان &copy; 2025</p>
  </div>

  <script>
    // Translation dictionary for success page
    const translations = {
      ar: {
        success_title: "تم تقديم طلبك بنجاح!",
        success_message: "شكرًا لك على اهتمامك بالانضمام إلى كادرنا التعليمي. يرجى الانتظار، سيتواصل فريقنا معك قريبًا.",
        back_button: "العودة إلى الصفحة الرئيسية",
        footer_note: "مدارس الإيمان الإسلامية - شمال لبنان &copy; 2025"
      },
      en: {
        success_title: "Application Submitted!",
        success_message: "Thank you for your interest in joining our teaching staff. Please wait, our team will contact you shortly.",
        back_button: "Back to Home Page",
        footer_note: "IMAN Islamic Schools - North Lebanon &copy; 2025"
      },
      fr: {
        success_title: "Candidature Soumise !",
        success_message: "Merci pour votre intérêt à rejoindre notre personnel enseignant. Veuillez patienter, notre équipe vous contactera sous peu.",
        back_button: "Retour à l'accueil",
        footer_note: "Écoles Islamiques IMAN - Nord Liban &copy; 2025"
      }
    };

    // Auto-detect language parameter or document settings
    window.addEventListener('load', () => {
      // Check parent window referrer or search parameter
      const urlParams = new URLSearchParams(window.location.search);
      let lang = urlParams.get('lang') || localStorage.getItem('lang') || 'ar';
      
      if (lang !== 'ar' && lang !== 'en' && lang !== 'fr') {
        lang = 'ar';
      }

      document.documentElement.lang = lang;
      if (lang === 'ar') {
        document.documentElement.setAttribute('dir', 'rtl');
      } else {
        document.documentElement.setAttribute('dir', 'ltr');
        // Flip arrow icon in English/French
        const arrowIcon = document.querySelector('.btn-home i');
        if (arrowIcon) {
          arrowIcon.className = 'fa-solid fa-arrow-right';
        }
      }

      // Apply translations
      document.querySelectorAll('[data-translate]').forEach(el => {
        const key = el.getAttribute('data-translate');
        if (translations[lang] && translations[lang][key]) {
          el.innerHTML = translations[lang][key];
        }
      });
    });
  </script>

</body>

</html>
